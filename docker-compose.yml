services:
  chroma:
    image: chromadb/chroma:0.5.23
    ports:
      - "8000:8000"
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      chroma:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      PYTHONPATH: /opt/airflow/src
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      CHROMA_COLLECTION: knowledge
      WIKI_USER_AGENT: ${WIKI_USER_AGENT:-airflow-chroma-rag/1.0 (portfolio project)}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - airflow_home:/opt/airflow/airflow-runtime
    command: >
      bash -c "airflow db migrate
      && airflow users create --username admin --firstname Admin --lastname User
         --role Admin --email admin@example.com --password admin || true
      && airflow scheduler & exec airflow webserver --port 8080"

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      chroma:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      CHROMA_COLLECTION: knowledge
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

volumes:
  chroma_data:
  airflow_home:
